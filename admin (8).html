<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מנהל · Padel Match Finder</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet" />

  <script type="importmap">
    {
      "imports": {
        "firebase/app":       "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js",
        "firebase/auth":      "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js"
      }
    }
  </script>

  <style>
    :root{--royal:#002366;--gold:#D4AF37;}
    *{box-sizing:border-box;}
    body{font-family:'Heebo',sans-serif;background:var(--royal);color:#fff;min-height:100vh;
      background-image:radial-gradient(ellipse at 80% 10%,rgba(212,175,55,.08) 0%,transparent 60%),radial-gradient(ellipse at 10% 90%,rgba(212,175,55,.06) 0%,transparent 50%);}
    .gold{color:var(--gold);}
    .card{background:rgba(0,48,128,.55);backdrop-filter:blur(12px);border:1px solid rgba(212,175,55,.25);border-radius:16px;}
    .court-lines{position:fixed;inset:0;opacity:.03;pointer-events:none;z-index:0;
      background-image:linear-gradient(90deg,var(--gold) 1px,transparent 1px),linear-gradient(0deg,var(--gold) 1px,transparent 1px);background-size:60px 60px;}

    /* ── Login screen ── */
    #loginScreen{position:fixed;inset:0;background:var(--royal);display:flex;align-items:center;justify-content:center;z-index:100;
      background-image:radial-gradient(ellipse at 80% 10%,rgba(212,175,55,.1) 0%,transparent 60%),radial-gradient(ellipse at 10% 90%,rgba(212,175,55,.08) 0%,transparent 50%);}
    #loginScreen.hidden{display:none;}
    input[type="email"],input[type="password"],input[type="text"]{
      background:rgba(0,21,64,.8);border:1px solid rgba(212,175,55,.4);color:#fff;
      border-radius:10px;padding:.85rem 1.1rem;width:100%;outline:none;
      font-family:'Heebo',sans-serif;font-size:1rem;transition:border-color .2s;}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15);}
    input::placeholder{color:rgba(255,255,255,.3);}
    .btn-gold{background:linear-gradient(135deg,var(--gold),#b8941f);color:var(--royal);font-weight:800;font-size:1rem;border:none;border-radius:12px;padding:.9rem 2rem;cursor:pointer;font-family:'Heebo',sans-serif;width:100%;transition:all .2s;box-shadow:0 4px 18px rgba(212,175,55,.3);}
    .btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(212,175,55,.4);}
    .btn-gold:disabled{opacity:.5;cursor:not-allowed;transform:none;}

    /* ── Dashboard ── */
    .match-group{border:1px solid rgba(212,175,55,.3);border-radius:14px;overflow:hidden;margin-bottom:1rem;}
    .match-header{background:rgba(212,175,55,.15);padding:.85rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(212,175,55,.2);}
    .badge{background:var(--gold);color:var(--royal);font-weight:800;border-radius:999px;padding:.2rem .75rem;font-size:.8rem;}
    .badge.green{background:#27ae60;color:#fff;}
    .badge.yellow{background:#e67e22;color:#fff;}
    .player-row{display:flex;align-items:center;padding:.75rem 1.25rem;gap:1rem;border-bottom:1px solid rgba(255,255,255,.05);}
    .player-row:last-child{border-bottom:none;}
    .skill-badge{width:2.2rem;height:2.2rem;border-radius:50%;background:rgba(212,175,55,.15);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:.8rem;flex-shrink:0;}
    .section-title{font-size:1.3rem;font-weight:900;color:var(--gold);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;}
    #loading{text-align:center;padding:3rem;color:rgba(255,255,255,.5);}
    select{background:rgba(0,21,64,.8);border:1px solid rgba(212,175,55,.4);color:#fff;border-radius:10px;padding:.6rem 1rem;font-family:'Heebo',sans-serif;font-size:.9rem;outline:none;cursor:pointer;}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    .fade-in{animation:fadeInUp .5s ease both;}
    .stat-card{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:1rem 1.5rem;text-align:center;}
    .stat-num{font-size:2rem;font-weight:900;color:var(--gold);line-height:1;}
    .stat-label{font-size:.78rem;color:rgba(255,255,255,.55);margin-top:.25rem;}
    .logout-btn{font-size:.82rem;color:rgba(212,175,55,.6);background:none;border:none;cursor:pointer;font-family:'Heebo',sans-serif;padding:.25rem .5rem;}
    .logout-btn:hover{color:var(--gold);}
  </style>
</head>
<body>
  <div class="court-lines"></div>

  <!-- ── Login Screen ── -->
  <div id="loginScreen">
    <div class="card p-8 w-full max-w-sm mx-4 text-center fade-in">
      <div class="text-5xl mb-4">🔐</div>
      <h2 class="text-2xl font-black gold mb-1">ממשק מנהל</h2>
      <p class="text-white/50 text-sm mb-6">התחבר עם חשבון המנהל שלך</p>
      <div style="display:flex;flex-direction:column;gap:.75rem">
        <input type="email" id="emailInput" placeholder="אימייל..." dir="ltr" />
        <input type="password" id="passInput" placeholder="סיסמה..." />
        <p id="loginError" class="hidden" style="color:#f87171;font-size:.85rem;"></p>
        <button class="btn-gold" id="loginBtn">כניסה →</button>
      </div>
    </div>
  </div>

  <!-- ── Dashboard ── -->
  <div id="dashboard" class="hidden relative z-10">
    <header class="py-7 text-center">
      <div class="inline-flex items-center gap-3 mb-1">
        <span class="text-3xl">🎾</span>
        <h1 class="text-3xl font-black gold">ממשק מנהל</h1>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:.75rem;margin-top:.25rem;">
        <p style="color:rgba(255,255,255,.4);font-size:.85rem">Padel Match Finder · תצוגת חפיפות</p>
        <button class="logout-btn" id="logoutBtn">יציאה ↩</button>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-16 space-y-8">

      <div class="grid grid-cols-3 gap-3 fade-in">
        <div class="stat-card"><div class="stat-num" id="statPlayers">–</div><div class="stat-label">שחקנים</div></div>
        <div class="stat-card"><div class="stat-num" id="statDates">–</div><div class="stat-label">תאריכים</div></div>
        <div class="stat-card"><div class="stat-num" id="statOverlaps">–</div><div class="stat-label">חפיפות</div></div>
      </div>

      <div class="flex items-center gap-3 fade-in">
        <label style="font-size:.9rem;color:rgba(255,255,255,.6)">סנן לפי תאריך:</label>
        <select id="dateFilter"><option value="">כל התאריכים</option></select>
        <button id="refreshBtn" style="margin-right:auto;font-size:.9rem;color:rgba(212,175,55,.7);background:none;border:none;cursor:pointer;font-family:'Heebo',sans-serif;">↻ רענן</button>
      </div>

      <div class="fade-in">
        <div class="section-title">⚡ חפיפות זמן</div>
        <div id="loading">טוען נתונים...</div>
        <div id="groupsContainer"></div>
      </div>

      <div class="fade-in">
        <div class="section-title">📋 כל הרשומות</div>
        <div class="card overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr style="border-bottom:1px solid rgba(255,255,255,.1);font-size:.75rem;color:rgba(212,175,55,.8)">
                <th class="text-right p-3">שם</th><th class="text-right p-3">טלפון</th>
                <th class="text-right p-3">רמה</th><th class="text-right p-3">תאריך</th><th class="text-right p-3">שעה</th>
              </tr>
            </thead>
            <tbody id="allTableBody">
              <tr><td colspan="5" class="text-center p-6" style="color:rgba(255,255,255,.4)">טוען...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script type="module">
    import { initializeApp }                                       from 'firebase/app';
    import { getFirestore, collection, getDocs, query, orderBy }  from 'firebase/firestore';
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'firebase/auth';

    // ════════════════════════════════════════════════════════
    // 🔥 PASTE YOUR FIREBASE CONFIG HERE (same as index.html)
    // ════════════════════════════════════════════════════════
    const firebaseConfig = {
      apiKey:            "YOUR_API_KEY",
      authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
      projectId:         "YOUR_PROJECT_ID",
      storageBucket:     "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId:             "YOUR_APP_ID"
    };
    // ════════════════════════════════════════════════════════

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);

    let allData = [];

    /* ── Auth state listener ── */
    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadData();
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
      }
    });

    /* ── Login ── */
    async function doLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const pass  = document.getElementById('passInput').value;
      const btn   = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'מתחבר...';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch(err) {
        errEl.textContent = 'אימייל או סיסמה שגויים. נסה שוב.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.textContent = 'כניסה →';
      }
    }
    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('passInput').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

    /* ── Logout ── */
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    /* ── Load data ── */
    async function loadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('groupsContainer').innerHTML = '';
      try {
        const q    = query(collection(db,'padel_availability'), orderBy('date'), orderBy('time_slot'));
        const snap = await getDocs(q);
        allData    = snap.docs.map(doc => ({id:doc.id,...doc.data()}));
      } catch(err) {
        document.getElementById('loading').textContent = 'שגיאה: ' + err.message;
        return;
      }
      document.getElementById('loading').style.display = 'none';

      const dates = [...new Set(allData.map(r=>r.date))].sort();
      const sel = document.getElementById('dateFilter');
      sel.innerHTML = '<option value="">כל התאריכים</option>';
      dates.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=fmt(d);sel.appendChild(o);});

      renderGroups(); renderTable();
    }
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('dateFilter').addEventListener('change', renderGroups);

    /* ── Render overlaps ── */
    function renderGroups() {
      const filter   = document.getElementById('dateFilter').value;
      const filtered = filter ? allData.filter(r=>r.date===filter) : allData;

      const groups = {};
      filtered.forEach(r=>{
        const key=`${r.date}||${r.time_slot}`;
        if(!groups[key]) groups[key]=[];
        groups[key].push(r);
      });

      document.getElementById('statPlayers').textContent  = new Set(filtered.map(r=>r.phone)).size;
      document.getElementById('statDates').textContent    = new Set(filtered.map(r=>r.date)).size;
      document.getElementById('statOverlaps').textContent = Object.values(groups).filter(g=>g.length>=2).length;

      const container = document.getElementById('groupsContainer');
      container.innerHTML = '';
      const keys = Object.keys(groups).sort();
      if(!keys.length){
        container.innerHTML='<div style="text-align:center;padding:2rem;color:rgba(255,255,255,.4)">אין נתונים להצגה</div>';
        return;
      }
      keys.forEach(key=>{
        const players=groups[key];
        const [date,time]=key.split('||');
        const count=players.length;
        const badgeClass=count>=4?'green':count>=2?'yellow':'';
        const matchLabel=count>=4?'✅ משחק מלא!':count>=2?'⚡ חפיפה':'';
        const div=document.createElement('div');
        div.className='match-group';
        div.innerHTML=`
          <div class="match-header">
            <div style="display:flex;align-items:center;gap:.75rem">
              <span style="font-weight:700;color:var(--gold)">${fmt(date)}</span>
              <span style="color:rgba(255,255,255,.5)">·</span>
              <span style="font-weight:600" dir="ltr">${time}</span>
            </div>
            <div style="display:flex;align-items:center;gap:.5rem">
              <span style="color:rgba(255,255,255,.5);font-size:.9rem">${count} שחקנים</span>
              ${badgeClass?`<span class="badge ${badgeClass}">${matchLabel}</span>`:''}
            </div>
          </div>
          <div class="players-wrap"></div>`;
        const wrap=div.querySelector('.players-wrap');
        players.forEach(p=>{
          const row=document.createElement('div');
          row.className='player-row';
          row.innerHTML=`
            <div class="skill-badge">${p.skill_level}</div>
            <div style="flex:1">
              <div style="font-weight:600;font-size:.9rem">${esc(p.name)}</div>
              <div style="color:rgba(255,255,255,.45);font-size:.78rem" dir="ltr">${esc(p.phone)}</div>
            </div>`;
          wrap.appendChild(row);
        });
        container.appendChild(div);
      });
    }

    /* ── Render table ── */
    function renderTable(){
      const tbody=document.getElementById('allTableBody');
      if(!allData.length){
        tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:rgba(255,255,255,.4)">אין רשומות</td></tr>';
        return;
      }
      tbody.innerHTML=allData.map(r=>`
        <tr style="border-bottom:1px solid rgba(255,255,255,.05)">
          <td style="padding:.75rem">${esc(r.name)}</td>
          <td style="padding:.75rem;color:rgba(255,255,255,.6)" dir="ltr">${esc(r.phone)}</td>
          <td style="padding:.75rem"><span class="skill-badge" style="display:inline-flex">${r.skill_level}</span></td>
          <td style="padding:.75rem;color:rgba(255,255,255,.8)">${fmt(r.date)}</td>
          <td style="padding:.75rem;font-family:monospace;color:rgba(212,175,55,.8)" dir="ltr">${r.time_slot}</td>
        </tr>`).join('');
    }

    function fmt(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  </script>
</body>
</html>
