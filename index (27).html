<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Match Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: '#002366',
                        'royal-light': '#003399',
                        'royal-dark': '#001a4d',
                        gold: '#D4AF37',
                        'gold-light': '#E8CC6E',
                        'gold-dark': '#B8960E',
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Heebo', sans-serif; margin: 0; }
        .font-rubik { font-family: 'Rubik', sans-serif; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #001a4d; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 3px; }

        /* Flatpickr custom styling */
        .flatpickr-calendar {
            direction: ltr;
            font-family: 'Heebo', sans-serif !important;
            background: #001a4d !important;
            border: 1px solid rgba(212,175,55,0.2) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
            border-radius: 16px !important;
            overflow: hidden;
            width: 100% !important;
            max-width: 100% !important;
        }
        .flatpickr-months { background: #002366; }
        .flatpickr-months .flatpickr-month { color: #D4AF37; fill: #D4AF37; }
        .flatpickr-current-month .cur-month { color: #D4AF37 !important; }
        .flatpickr-current-month input.cur-year { color: #D4AF37 !important; }
        .flatpickr-months .flatpickr-prev-month,
        .flatpickr-months .flatpickr-next-month { fill: #D4AF37 !important; color: #D4AF37 !important; }
        .flatpickr-months .flatpickr-prev-month:hover svg,
        .flatpickr-months .flatpickr-next-month:hover svg { fill: #E8CC6E !important; }
        span.flatpickr-weekday { color: rgba(212,175,55,0.5) !important; font-weight: 600; }
        .flatpickr-day {
            color: rgba(212,175,55,0.7) !important;
            border-radius: 8px !important;
        }
        .flatpickr-day:hover {
            background: rgba(212,175,55,0.15) !important;
            border-color: rgba(212,175,55,0.3) !important;
        }
        .flatpickr-day.today { border-color: rgba(212,175,55,0.5) !important; }
        .flatpickr-day.selected {
            background: #D4AF37 !important;
            border-color: #D4AF37 !important;
            color: #002366 !important;
            font-weight: 700 !important;
        }
        .flatpickr-day.flatpickr-disabled { color: rgba(212,175,55,0.15) !important; }
        .dayContainer { padding: 4px; }
        .flatpickr-innerContainer { padding-bottom: 8px; }

        /* Skill slider */
        .skill-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to left, #D4AF37, #003399);
            outline: none;
            cursor: pointer;
        }
        .skill-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #D4AF37;
            cursor: pointer;
            border: 3px solid #002366;
            box-shadow: 0 0 12px rgba(212,175,55,0.5);
        }
        .skill-slider::-moz-range-thumb {
            width: 30px; height: 30px; border-radius: 50%;
            background: #D4AF37; cursor: pointer;
            border: 3px solid #002366;
            box-shadow: 0 0 12px rgba(212,175,55,0.5);
        }

        /* Hour chip */
        .hour-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 4px;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Rubik', sans-serif;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: all 0.15s ease;
            border: 1px solid rgba(212,175,55,0.12);
            background: rgba(0,26,77,0.5);
            color: rgba(212,175,55,0.55);
            -webkit-tap-highlight-color: transparent;
        }
        .hour-chip:hover {
            transform: translateY(-1px);
            border-color: rgba(212,175,55,0.3);
            color: #D4AF37;
            background: rgba(0,26,77,0.8);
        }
        .hour-chip:active { transform: scale(0.96); }
        .hour-chip.active {
            background: #D4AF37 !important;
            color: #002366 !important;
            font-weight: 700 !important;
            border-color: #D4AF37 !important;
            box-shadow: 0 0 14px rgba(212,175,55,0.35);
        }

        /* Date tag */
        .date-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(212,175,55,0.12);
            color: #D4AF37;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(212,175,55,0.2);
        }
        .date-tag button {
            background: none; border: none;
            color: rgba(212,175,55,0.5); cursor: pointer;
            font-size: 16px; line-height: 1; padding: 0; margin-right: 2px;
        }
        .date-tag button:hover { color: #ff6b6b; }

        /* Quick-action link */
        .qa-link {
            font-size: 11px;
            color: rgba(212,175,55,0.35);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .qa-link:hover { color: rgba(212,175,55,0.7); }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .anim-in { animation: fadeInUp 0.4s ease forwards; }
        .anim-d1 { animation: fadeInUp 0.4s ease 0.08s forwards; opacity: 0; }
        .anim-d2 { animation: fadeInUp 0.4s ease 0.16s forwards; opacity: 0; }
        .anim-d3 { animation: fadeInUp 0.4s ease 0.24s forwards; opacity: 0; }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .btn-shimmer {
            background: linear-gradient(90deg, #D4AF37 0%, #E8CC6E 25%, #D4AF37 50%, #E8CC6E 75%, #D4AF37 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }

        .success-overlay {
            position: fixed; inset: 0; z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(0,35,102,0.92);
            display: none;
            align-items: center;
            justify-content: center;
        }
        .success-overlay.show { display: flex; }
    </style>
</head>
<body style="min-height:100vh; background:#002366; overflow-x:hidden;">

    <!-- Decorative blurs -->
    <div style="position:fixed;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:#D4AF37;opacity:0.025;filter:blur(80px);pointer-events:none;"></div>
    <div style="position:fixed;bottom:-100px;left:-100px;width:400px;height:400px;border-radius:50%;background:#D4AF37;opacity:0.025;filter:blur(80px);pointer-events:none;"></div>

    <div style="position:relative;z-index:1;max-width:500px;margin:0 auto;padding:20px 16px 80px;">

        <!-- Header -->
        <div class="anim-in" style="text-align:center;margin-bottom:28px;">
            <div style="display:inline-flex;width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#D4AF37,#B8960E);align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(212,175,55,0.2);margin-bottom:10px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#002366" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="22" stroke-width="1.5"/><line x1="2" y1="12" x2="22" y2="12" stroke-width="1.5"/>
                </svg>
            </div>
            <h1 class="font-rubik" style="font-size:28px;font-weight:900;color:#D4AF37;letter-spacing:-0.5px;margin:0;">PADEL FINDER</h1>
            <p style="color:rgba(212,175,55,0.4);font-size:13px;margin:4px 0 0;font-weight:300;">מצא שותפים למשחק הבא שלך</p>
        </div>

        <!-- Form -->
        <div id="mainForm" style="display:flex;flex-direction:column;gap:18px;">

            <!-- Name -->
            <div class="anim-d1">
                <label style="display:block;color:rgba(212,175,55,0.75);font-size:13px;font-weight:500;margin-bottom:6px;">שם מלא</label>
                <input type="text" id="playerName" placeholder="הכנס את שמך"
                    style="width:100%;padding:12px 16px;border-radius:12px;background:rgba(0,51,153,0.4);border:1px solid rgba(212,175,55,0.18);color:#D4AF37;font-size:15px;outline:none;font-family:'Heebo',sans-serif;"
                    onfocus="this.style.borderColor='rgba(212,175,55,0.5)'" onblur="this.style.borderColor='rgba(212,175,55,0.18)'">
            </div>

            <!-- Phone -->
            <div class="anim-d1">
                <label style="display:block;color:rgba(212,175,55,0.75);font-size:13px;font-weight:500;margin-bottom:6px;">טלפון</label>
                <input type="tel" id="playerPhone" placeholder="050-0000000" dir="ltr"
                    style="width:100%;padding:12px 16px;border-radius:12px;background:rgba(0,51,153,0.4);border:1px solid rgba(212,175,55,0.18);color:#D4AF37;font-size:15px;outline:none;text-align:right;font-family:'Heebo',sans-serif;"
                    onfocus="this.style.borderColor='rgba(212,175,55,0.5)'" onblur="this.style.borderColor='rgba(212,175,55,0.18)'">
            </div>

            <!-- Skill Level -->
            <div class="anim-d2">
                <label style="display:block;color:rgba(212,175,55,0.75);font-size:13px;font-weight:500;margin-bottom:8px;">רמת משחק</label>
                <div style="background:rgba(0,51,153,0.25);border-radius:16px;padding:16px;border:1px solid rgba(212,175,55,0.1);">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <span style="color:rgba(212,175,55,0.35);font-size:11px;">מתחיל</span>
                        <span id="skillDisplay" class="font-rubik" style="color:#D4AF37;font-weight:700;font-size:28px;">3.0</span>
                        <span style="color:rgba(212,175,55,0.35);font-size:11px;">מקצוען</span>
                    </div>
                    <input type="range" id="skillLevel" min="1" max="5" step="0.5" value="3" class="skill-slider">
                    <div style="display:flex;justify-content:space-between;padding:4px 2px 0;">
                        <span style="color:rgba(212,175,55,0.2);font-size:10px;">1</span>
                        <span style="color:rgba(212,175,55,0.2);font-size:10px;">2</span>
                        <span style="color:rgba(212,175,55,0.2);font-size:10px;">3</span>
                        <span style="color:rgba(212,175,55,0.2);font-size:10px;">4</span>
                        <span style="color:rgba(212,175,55,0.2);font-size:10px;">5</span>
                    </div>
                </div>
            </div>

            <!-- Date Picker -->
            <div class="anim-d2">
                <label style="display:block;color:rgba(212,175,55,0.75);font-size:13px;font-weight:500;margin-bottom:8px;">בחר תאריכים</label>
                <div id="calendarContainer"></div>
                <div id="selectedDatesTags" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
            </div>

            <!-- Per-date time slots -->
            <div id="timeSlotsContainer" style="display:flex;flex-direction:column;gap:12px;">
                <div style="text-align:center;padding:24px 0;color:rgba(212,175,55,0.25);font-size:13px;">
                    בחר תאריכים למעלה כדי לראות שעות
                </div>
            </div>

            <!-- Submit -->
            <div class="anim-d3" style="padding-top:8px;">
                <button id="submitBtn" type="button" class="btn-shimmer"
                    style="width:100%;padding:16px;border-radius:14px;border:none;color:#002366;font-weight:700;font-size:17px;cursor:pointer;font-family:'Heebo',sans-serif;box-shadow:0 8px 24px rgba(212,175,55,0.2);">
                    שלח ומצא שותפים 🏸
                </button>
            </div>
        </div>

        <!-- Admin link -->
        <div style="text-align:center;margin-top:32px;">
            <a href="admin.html" style="color:rgba(212,175,55,0.15);font-size:11px;text-decoration:none;">ניהול</a>
        </div>
    </div>

    <!-- Success Overlay -->
    <div id="successOverlay" class="success-overlay">
        <div class="anim-in" style="text-align:center;padding:32px;">
            <div style="width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:rgba(212,175,55,0.15);display:flex;align-items:center;justify-content:center;">
                <svg width="36" height="36" fill="none" stroke="#D4AF37" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h2 style="color:#D4AF37;font-size:24px;font-weight:700;margin:0 0 8px;">נרשמת בהצלחה!</h2>
            <p style="color:rgba(212,175,55,0.5);font-size:14px;margin:0 0 24px;">נעדכן אותך כשנמצא שותפים למשחק</p>
            <button id="resetBtn" type="button"
                style="padding:12px 32px;border-radius:12px;border:2px solid rgba(212,175,55,0.35);background:none;color:#D4AF37;font-size:15px;cursor:pointer;font-family:'Heebo',sans-serif;">
                הרשמה נוספת
            </button>
        </div>
    </div>

    <script>
    // =====================================================
    // SUPABASE CONFIGURATION
    // Replace with your Supabase project credentials:
    //   1. Go to https://supabase.com -> Your Project -> Settings -> API
    //   2. Copy "URL" and "anon public" key
    //
    // SQL to create the table:
    //   CREATE TABLE padel_players (
    //     id SERIAL PRIMARY KEY,
    //     name TEXT NOT NULL,
    //     phone TEXT NOT NULL,
    //     skill_level DECIMAL(2,1) NOT NULL,
    //     play_date DATE NOT NULL,
    //     time_slot TEXT NOT NULL,
    //     created_at TIMESTAMPTZ DEFAULT NOW()
    //   );
    // =====================================================
    var SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
    var SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

    var sb = null;
    if (SUPABASE_URL !== 'YOUR_SUPABASE_URL_HERE') {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // =====================================================
    // STATE
    // =====================================================
    var selectedDates = [];
    var hoursByDate = {};
    var fpInstance = null;

    // Hours 06:00 through 00:00
    var HOURS = [];
    for (var h = 6; h <= 23; h++) {
        HOURS.push(String(h).padStart(2, '0') + ':00');
    }
    HOURS.push('00:00');

    // =====================================================
    // INIT - all event listeners set up here
    // =====================================================
    document.addEventListener('DOMContentLoaded', function() {

        // ---- Skill slider ----
        var slider = document.getElementById('skillLevel');
        var display = document.getElementById('skillDisplay');

        function updateDisplay() {
            display.textContent = parseFloat(slider.value).toFixed(1);
        }
        slider.addEventListener('input', updateDisplay);
        slider.addEventListener('change', updateDisplay);
        // Touch support
        slider.addEventListener('touchmove', updateDisplay);

        // ---- Flatpickr ----
        fpInstance = flatpickr(document.getElementById('calendarContainer'), {
            mode: 'multiple',
            dateFormat: 'Y-m-d',
            minDate: 'today',
            inline: true,
            locale: {
                firstDayOfWeek: 0,
                weekdays: {
                    shorthand: ['א','ב','ג','ד','ה','ו','ש'],
                    longhand: ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת']
                },
                months: {
                    shorthand: ['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'],
                    longhand: ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר']
                }
            },
            onChange: function(dates) {
                selectedDates = dates.map(function(d) { return toISO(d); }).sort();
                // Remove hours for deselected dates
                var existing = Object.keys(hoursByDate);
                for (var i = 0; i < existing.length; i++) {
                    if (selectedDates.indexOf(existing[i]) === -1) {
                        delete hoursByDate[existing[i]];
                    }
                }
                // Init new dates
                for (var j = 0; j < selectedDates.length; j++) {
                    if (!hoursByDate[selectedDates[j]]) {
                        hoursByDate[selectedDates[j]] = {};
                    }
                }
                renderTags();
                renderTimeSlots();
            }
        });

        // ---- Submit ----
        document.getElementById('submitBtn').addEventListener('click', submitForm);

        // ---- Reset ----
        document.getElementById('resetBtn').addEventListener('click', resetForm);

        // ---- Event delegation for hour chips and actions ----
        document.getElementById('timeSlotsContainer').addEventListener('click', function(e) {
            // Hour chip click
            var chip = e.target.closest('.hour-chip');
            if (chip) {
                var dateVal = chip.getAttribute('data-date');
                var hourVal = chip.getAttribute('data-hour');
                if (dateVal && hourVal) {
                    toggleHour(dateVal, hourVal);
                }
                return;
            }
            // Select all
            var selAll = e.target.closest('[data-action="select-all"]');
            if (selAll) {
                selectAllHours(selAll.getAttribute('data-date'));
                return;
            }
            // Clear all
            var clrAll = e.target.closest('[data-action="clear-all"]');
            if (clrAll) {
                clearAllHours(clrAll.getAttribute('data-date'));
                return;
            }
        });

        // ---- Event delegation for date tag removal ----
        document.getElementById('selectedDatesTags').addEventListener('click', function(e) {
            var btn = e.target.closest('[data-action="remove-date"]');
            if (btn) {
                removeDateFromCalendar(btn.getAttribute('data-date'));
            }
        });
    });

    // =====================================================
    // HELPERS
    // =====================================================
    function toISO(date) {
        var y = date.getFullYear();
        var m = String(date.getMonth() + 1).padStart(2, '0');
        var d = String(date.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
    }

    function toHebrew(iso) {
        var parts = iso.split('-');
        var dayNames = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
        var dt = new Date(iso + 'T12:00:00');
        return 'יום ' + dayNames[dt.getDay()] + ', ' + parseInt(parts[2]) + '.' + parseInt(parts[1]);
    }

    function removeDateFromCalendar(iso) {
        var remaining = fpInstance.selectedDates.filter(function(d) {
            return toISO(d) !== iso;
        });
        fpInstance.setDate(remaining, true);
    }

    // =====================================================
    // RENDER DATE TAGS
    // =====================================================
    function renderTags() {
        var container = document.getElementById('selectedDatesTags');
        var html = '';
        for (var i = 0; i < selectedDates.length; i++) {
            var d = selectedDates[i];
            html += '<span class="date-tag">' + toHebrew(d) +
                '<button data-action="remove-date" data-date="' + d + '" title="הסר">&times;</button></span>';
        }
        container.innerHTML = html;
    }

    // =====================================================
    // RENDER TIME SLOTS PER DATE
    // =====================================================
    function renderTimeSlots() {
        var container = document.getElementById('timeSlotsContainer');

        if (selectedDates.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:24px 0;color:rgba(212,175,55,0.25);font-size:13px;">בחר תאריכים למעלה כדי לראות שעות</div>';
            return;
        }

        var html = '';
        for (var i = 0; i < selectedDates.length; i++) {
            var dateStr = selectedDates[i];
            var dateHours = hoursByDate[dateStr] || {};
            var count = Object.keys(dateHours).length;

            html += '<div style="background:rgba(0,51,153,0.15);border-radius:16px;border:1px solid rgba(212,175,55,0.1);overflow:hidden;">';

            // Header
            html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(0,26,77,0.35);border-bottom:1px solid rgba(212,175,55,0.08);">';
            html += '<div style="display:flex;align-items:center;gap:8px;">';
            html += '<div style="width:8px;height:8px;border-radius:50%;background:' + (count > 0 ? '#D4AF37' : 'rgba(212,175,55,0.25)') + ';"></div>';
            html += '<span style="color:#D4AF37;font-weight:600;font-size:14px;">' + toHebrew(dateStr) + '</span>';
            html += '</div>';
            html += '<span style="color:rgba(212,175,55,0.35);font-size:11px;">' + (count > 0 ? count + ' שעות נבחרו' : 'בחר שעות') + '</span>';
            html += '</div>';

            // Hours grid
            html += '<div style="padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">';
            for (var j = 0; j < HOURS.length; j++) {
                var hr = HOURS[j];
                var isActive = dateHours[hr] === true;
                html += '<div class="hour-chip' + (isActive ? ' active' : '') + '" data-date="' + dateStr + '" data-hour="' + hr + '">' + hr + '</div>';
            }
            html += '</div>';

            // Quick actions
            html += '<div style="padding:4px 16px 12px;display:flex;gap:8px;align-items:center;">';
            html += '<span class="qa-link" data-action="select-all" data-date="' + dateStr + '">בחר הכל</span>';
            html += '<span style="color:rgba(212,175,55,0.12);">|</span>';
            html += '<span class="qa-link" data-action="clear-all" data-date="' + dateStr + '">נקה</span>';
            html += '</div>';

            html += '</div>';
        }

        container.innerHTML = html;
    }

    // =====================================================
    // HOUR TOGGLE LOGIC
    // =====================================================
    function toggleHour(dateStr, hour) {
        if (!hoursByDate[dateStr]) hoursByDate[dateStr] = {};
        if (hoursByDate[dateStr][hour]) {
            delete hoursByDate[dateStr][hour];
        } else {
            hoursByDate[dateStr][hour] = true;
        }
        renderTimeSlots();
    }

    function selectAllHours(dateStr) {
        if (!hoursByDate[dateStr]) hoursByDate[dateStr] = {};
        for (var i = 0; i < HOURS.length; i++) {
            hoursByDate[dateStr][HOURS[i]] = true;
        }
        renderTimeSlots();
    }

    function clearAllHours(dateStr) {
        hoursByDate[dateStr] = {};
        renderTimeSlots();
    }

    // =====================================================
    // SUBMIT
    // =====================================================
    async function submitForm() {
        var name = document.getElementById('playerName').value.trim();
        var phone = document.getElementById('playerPhone').value.trim();
        var skill = parseFloat(document.getElementById('skillLevel').value);

        if (!name || !phone) {
            showToast('נא למלא שם וטלפון');
            return;
        }

        var entries = [];
        for (var i = 0; i < selectedDates.length; i++) {
            var d = selectedDates[i];
            var hours = hoursByDate[d];
            if (hours) {
                var keys = Object.keys(hours);
                for (var j = 0; j < keys.length; j++) {
                    entries.push({
                        name: name,
                        phone: phone,
                        skill_level: skill,
                        play_date: d,
                        time_slot: keys[j]
                    });
                }
            }
        }

        if (entries.length === 0) {
            showToast('נא לבחור לפחות תאריך ושעה אחת');
            return;
        }

        if (!sb) {
            console.log('Demo mode - entries:', entries);
            showSuccess();
            return;
        }

        try {
            var result = await sb.from('padel_players').insert(entries);
            if (result.error) throw result.error;
            showSuccess();
        } catch (err) {
            console.error(err);
            showToast('שגיאה בשליחה. נסה שוב.');
        }
    }

    // =====================================================
    // UI HELPERS
    // =====================================================
    function showSuccess() {
        document.getElementById('successOverlay').classList.add('show');
    }

    function resetForm() {
        document.getElementById('successOverlay').classList.remove('show');
        document.getElementById('playerName').value = '';
        document.getElementById('playerPhone').value = '';
        document.getElementById('skillLevel').value = 3;
        document.getElementById('skillDisplay').textContent = '3.0';
        selectedDates = [];
        hoursByDate = {};
        fpInstance.clear();
        renderTags();
        renderTimeSlots();
    }

    function showToast(msg) {
        var toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;background:#D4AF37;color:#002366;padding:12px 24px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(212,175,55,0.3);font-family:Heebo,sans-serif;white-space:nowrap;';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; }, 2200);
        setTimeout(function() { toast.remove(); }, 2600);
    }
    </script>
