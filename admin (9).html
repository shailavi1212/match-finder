<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Finder – ניהול</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: '#002366',
                        'royal-light': '#003399',
                        'royal-dark': '#001a4d',
                        gold: '#D4AF37',
                        'gold-light': '#E8CC6E',
                        'gold-dark': '#B8960E',
                    }
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Heebo', sans-serif; }
        .font-rubik { font-family: 'Rubik', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #001a4d; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 3px; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeInUp 0.5s ease forwards; }
    </style>
</head>
<body class="min-h-screen bg-royal">

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-sm animate-in">
            <div class="text-center mb-8">
                <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-gold to-gold-dark flex items-center justify-center shadow-lg shadow-gold/20 mb-3">
                    <svg class="w-7 h-7 text-royal" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gold font-rubik">ניהול</h1>
                <p class="text-gold/40 text-sm mt-1">הכנס סיסמה כדי לצפות בנתונים</p>
            </div>
            <div class="space-y-3">
                <input type="password" id="adminPassword" placeholder="סיסמה"
                    class="w-full px-4 py-3 rounded-xl bg-royal-light/50 border border-gold/20 text-gold placeholder-gold/30 focus:outline-none focus:border-gold/60 transition-all text-center text-lg tracking-widest"
                    onkeydown="if(event.key==='Enter') checkPassword()">
                <button onclick="checkPassword()"
                    class="w-full py-3 rounded-xl bg-gold text-royal font-bold text-base hover:bg-gold-light transition-colors">
                    כניסה
                </button>
                <p id="loginError" class="text-red-400 text-sm text-center hidden">סיסמה שגויה</p>
            </div>
            <div class="text-center mt-6">
                <a href="index.html" class="text-gold/30 text-xs hover:text-gold/50 transition-colors">← חזרה לרישום</a>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden">
        <div class="max-w-3xl mx-auto px-4 py-6">

            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gold font-rubik">לוח בקרה</h1>
                    <p class="text-gold/40 text-sm">חפיפות זמנים בין שחקנים</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="fetchData()" class="px-4 py-2 rounded-lg bg-gold/10 border border-gold/20 text-gold text-sm hover:bg-gold/20 transition-colors">
                        רענן 🔄
                    </button>
                    <a href="index.html" class="px-4 py-2 rounded-lg bg-royal-light border border-gold/10 text-gold/50 text-sm hover:text-gold transition-colors">
                        חזרה
                    </a>
                </div>
            </div>

            <!-- Stats -->
            <div id="statsBar" class="grid grid-cols-3 gap-3 mb-6">
                <div class="bg-royal-light/40 rounded-xl p-4 border border-gold/10 text-center">
                    <div id="statPlayers" class="text-2xl font-bold text-gold font-rubik">-</div>
                    <div class="text-gold/40 text-xs">שחקנים</div>
                </div>
                <div class="bg-royal-light/40 rounded-xl p-4 border border-gold/10 text-center">
                    <div id="statDates" class="text-2xl font-bold text-gold font-rubik">-</div>
                    <div class="text-gold/40 text-xs">תאריכים</div>
                </div>
                <div class="bg-royal-light/40 rounded-xl p-4 border border-gold/10 text-center">
                    <div id="statOverlaps" class="text-2xl font-bold text-gold font-rubik">-</div>
                    <div class="text-gold/40 text-xs">חפיפות</div>
                </div>
            </div>

            <!-- Loading -->
            <div id="loadingState" class="text-center py-12">
                <div class="inline-block w-8 h-8 border-2 border-gold/30 border-t-gold rounded-full animate-spin"></div>
                <p class="text-gold/40 text-sm mt-3">טוען נתונים...</p>
            </div>

            <!-- Results -->
            <div id="resultsContainer" class="space-y-4 hidden"></div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-16 hidden">
                <div class="text-gold/20 text-5xl mb-4">🏓</div>
                <p class="text-gold/40 text-sm">אין נתונים עדיין</p>
            </div>

        </div>
    </div>

    <script>
    // =====================================================
    // SUPABASE CONFIGURATION (same as index.html)
    // =====================================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';

    // =====================================================
    // ADMIN PASSWORD
    // Change this to your desired admin password:
    // =====================================================
    const ADMIN_PASSWORD = 'padel2024';

    let supabase = null;
    if (SUPABASE_URL !== 'YOUR_SUPABASE_URL_HERE') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    // =====================================================
    // AUTH
    // =====================================================
    function checkPassword() {
        const pw = document.getElementById('adminPassword').value;
        if (pw === ADMIN_PASSWORD) {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            fetchData();
        } else {
            document.getElementById('loginError').classList.remove('hidden');
            setTimeout(() => document.getElementById('loginError').classList.add('hidden'), 2000);
        }
    }

    // =====================================================
    // FETCH & DISPLAY
    // =====================================================
    async function fetchData() {
        document.getElementById('loadingState').classList.remove('hidden');
        document.getElementById('resultsContainer').classList.add('hidden');
        document.getElementById('emptyState').classList.add('hidden');

        let data = [];

        if (supabase) {
            try {
                const { data: rows, error } = await supabase
                    .from('padel_players')
                    .select('*')
                    .order('play_date', { ascending: true })
                    .order('time_slot', { ascending: true });
                if (error) throw error;
                data = rows || [];
            } catch (err) {
                console.error(err);
                document.getElementById('loadingState').classList.add('hidden');
                return;
            }
        } else {
            // Demo data
            data = generateDemoData();
        }

        document.getElementById('loadingState').classList.add('hidden');

        if (data.length === 0) {
            document.getElementById('emptyState').classList.remove('hidden');
            updateStats(0, 0, 0);
            return;
        }

        // Group by date -> time_slot
        const grouped = {};
        data.forEach(row => {
            const key = row.play_date;
            if (!grouped[key]) grouped[key] = {};
            if (!grouped[key][row.time_slot]) grouped[key][row.time_slot] = [];
            grouped[key][row.time_slot].push(row);
        });

        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        let totalOverlaps = 0;
        const uniquePlayers = new Set(data.map(r => r.phone));
        const uniqueDates = new Set(data.map(r => r.play_date));

        const sortedDates = Object.keys(grouped).sort();

        sortedDates.forEach(date => {
            const slots = grouped[date];
            const sortedSlots = Object.keys(slots).sort();

            const dateSection = document.createElement('div');
            dateSection.className = 'bg-royal-light/20 rounded-2xl border border-gold/10 overflow-hidden animate-in';

            // Date header
            const dateLabel = formatDateHebrew(date);
            let hasOverlap = false;
            sortedSlots.forEach(slot => {
                if (slots[slot].length >= 2) hasOverlap = true;
            });

            let slotsHTML = '';
            sortedSlots.forEach(slot => {
                const players = slots[slot];
                const isOverlap = players.length >= 2;
                if (isOverlap) totalOverlaps++;

                const badge = isOverlap
                    ? `<span class="px-2 py-0.5 rounded-full bg-green-500/20 text-green-400 text-[10px] font-bold">✓ ${players.length} שחקנים</span>`
                    : `<span class="px-2 py-0.5 rounded-full bg-gold/10 text-gold/30 text-[10px]">שחקן 1</span>`;

                let playersHTML = '';
                players.forEach(p => {
                    const stars = getSkillBars(p.skill_level);
                    playersHTML += `
                        <div class="flex items-center justify-between py-2 ${players.indexOf(p) < players.length - 1 ? 'border-b border-gold/5' : ''}">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-gold/15 flex items-center justify-center text-gold text-xs font-bold">
                                    ${p.name.charAt(0)}
                                </div>
                                <div>
                                    <div class="text-gold text-sm font-medium">${p.name}</div>
                                    <div class="text-gold/30 text-xs font-rubik" dir="ltr">${p.phone}</div>
                                </div>
                            </div>
                            <div class="text-left">
                                <div class="flex items-center gap-1">
                                    ${stars}
                                    <span class="text-gold/50 text-xs font-rubik mr-1">${p.skill_level}</span>
                                </div>
                            </div>
                        </div>`;
                });

                slotsHTML += `
                    <div class="px-4 py-3 ${isOverlap ? 'bg-green-500/5' : ''} ${sortedSlots.indexOf(slot) < sortedSlots.length - 1 ? 'border-b border-gold/5' : ''}">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-gold font-rubik font-bold text-base">${slot}</span>
                            ${badge}
                        </div>
                        <div class="pr-2">
                            ${playersHTML}
                        </div>
                    </div>`;
            });

            dateSection.innerHTML = `
                <div class="flex items-center justify-between px-4 py-3 bg-royal-dark/40 border-b border-gold/10">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full ${hasOverlap ? 'bg-green-400' : 'bg-gold/30'}"></div>
                        <span class="text-gold font-bold">${dateLabel}</span>
                    </div>
                    <span class="text-gold/30 text-xs">${sortedSlots.length} משבצות</span>
                </div>
                ${slotsHTML}`;

            container.appendChild(dateSection);
        });

        container.classList.remove('hidden');
        updateStats(uniquePlayers.size, uniqueDates.size, totalOverlaps);
    }

    function updateStats(players, dates, overlaps) {
        document.getElementById('statPlayers').textContent = players;
        document.getElementById('statDates').textContent = dates;
        document.getElementById('statOverlaps').textContent = overlaps;
    }

    function getSkillBars(level) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            if (level >= i) {
                html += `<div class="w-1.5 h-3 rounded-sm bg-gold"></div>`;
            } else if (level >= i - 0.5) {
                html += `<div class="w-1.5 h-3 rounded-sm bg-gradient-to-t from-gold to-gold/30"></div>`;
            } else {
                html += `<div class="w-1.5 h-3 rounded-sm bg-gold/15"></div>`;
            }
        }
        return html;
    }

    function formatDateHebrew(isoStr) {
        const [y, m, d] = isoStr.split('-');
        const dayNames = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
        const dt = new Date(isoStr + 'T00:00:00');
        const dayName = dayNames[dt.getDay()];
        return `יום ${dayName}, ${parseInt(d)}.${parseInt(m)}.${y}`;
    }

    // =====================================================
    // DEMO DATA (shown when Supabase is not configured)
    // =====================================================
    function generateDemoData() {
        const today = new Date();
        const d1 = formatISO(today);
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const d2 = formatISO(tomorrow);

        return [
            { name: 'דני כהן', phone: '050-1234567', skill_level: 3.5, play_date: d1, time_slot: '19:00' },
            { name: 'יוסי לוי', phone: '052-9876543', skill_level: 4.0, play_date: d1, time_slot: '19:00' },
            { name: 'מיכל אברהם', phone: '054-5551234', skill_level: 2.5, play_date: d1, time_slot: '19:00' },
            { name: 'רון שמעוני', phone: '050-7778899', skill_level: 3.0, play_date: d1, time_slot: '20:00' },
            { name: 'דני כהן', phone: '050-1234567', skill_level: 3.5, play_date: d2, time_slot: '07:00' },
            { name: 'רון שמעוני', phone: '050-7778899', skill_level: 3.0, play_date: d2, time_slot: '07:00' },
            { name: 'שרה גולן', phone: '053-1112233', skill_level: 4.5, play_date: d2, time_slot: '21:00' },
        ];
    }

    function formatISO(d) {
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    </script>
</body>
</html>
